# Таблица «метод API или термин -> где менять в вашей системе (ТАЛАРИКС MES)».
#
# Зачем: агент по этой таблице определяет, чего касается изменение, и письмо отвечает не только «что изменилось»,
# но и «что менять». Название записи попадает в тему письма («срок: 01.09.2026, затронуто: авторизация и токен»).
#
# Как заполнять:
#   name  — короткое название (его увидите в письме); агент использует названия только из этой таблицы
#   terms — слова и фрагменты, по которым запись узнают в документах: методы API, термины, коды ошибок
#   where — ГДЕ ПРАВИТЬ: объект конфигурации и обработка в вашей системе. Пока пусто, в письме будет только название.
#
# Записи ниже — примеры по вашему списку методов; поправьте под себя, добавьте свои, лишнее удалите.
entries:
  - name: Авторизация и токен
    terms: [авторизация, токен, auth, simpleSignIn, УКЭП, МЧД, срок действия токена]
    where: ""

  - name: Информация о кодах маркировки (cises/info)
    terms: [cises/info, информация о коде, статус кода, КИ, коды маркировки]
    where: ""

  - name: Документы (создание, отправка, приёмка)
    terms: [документы, УПД, отгрузка, приёмка, создание документа, отправка документа]
    where: ""

  - name: Отчёт о нанесении
    terms: [отчёт о нанесении, нанесение, эмиссия кодов]
    where: ""

  - name: Меркурий и ВСД
    terms: [Меркурий, ВетИС, ВСД, ветеринарный сопроводительный документ, гашение, погашение ВСД, шлюз API]
    where: ""

  - name: Вес и усушка (мясо)
    terms: [вес, переменный вес, усушка]
    where: ""

  - name: Сроки отключения и смена хостов API
    terms: [устаревшее API, отключение, версия API, новый хост, адрес сервера, HTTP 410]
    where: ""
