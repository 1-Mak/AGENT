# Таблица «метод API или термин -> где менять в вашей системе (ТАЛАРИКС MES)».
#
# Зачем: агент по этой таблице определяет, чего касается изменение, и письмо отвечает не только «что изменилось»,
# но и «что менять». Название записи попадает в тему письма («срок: 01.09.2026, затронуто: авторизация и токен»).
#
# Как заполнять:
#   name  — короткое название (его увидите в письме); агент использует названия только из этой таблицы
#   terms — слова и фрагменты, по которым запись узнают в документах: методы API, термины, коды ошибок, поля
#   where — ГДЕ ПРАВИТЬ: объект конфигурации и обработка в вашей системе
#
# Наполнено по протоколу обмена TALARIX MES с ГИС МТ (v1.2) для товарной группы «Мясные изделия»: методы СУЗ API 3.0
# (order, utilisation) и True API (documents/create, LP_INTRODUCE_GOODS). Имена объектов MES взяты из протокола;
# точные имена модулей и обработок в конфигурации уточните у разработчика и впишите сюда. Другому клиенту могут
# понадобиться другие объекты: правьте под проект.
entries:
  - name: Авторизация и токен
    terms: [auth/key, simpleSignIn, unitedToken, clientToken, токен, авторизация, срок действия токена, МЧД, машиночитаемая доверенность]
    where: >
      Обработчик обмена с ГИС МТ: получение токена (ключ -> подпись -> токен), хранение и продление токена,
      параметры подключения.

  - name: Подпись (УКЭП, КриптоПро)
    terms: [подпись, УКЭП, X-Signature, открепленная подпись, откреплённая подпись, присоединенная подпись, прикрепленная подпись, КриптоПро, алгоритм подписи, ГОСТ Р 34.10]
    where: >
      Подписание в обработчике обмена (КриптоПро, локальная установка): подпись документа обмена и подпись
      запроса. Протокол v1.2 использует открепленную подпись product_document; проверить, затрагивает ли изменение
      способ подписи на шаге авторизации.

  - name: Заказ кодов маркировки (СУЗ, order)
    terms: [/api/v3/order, заказ на эмиссию, эмиссия кодов, templateId, serialNumberType, cisType, releaseMethodType, paymentType, productionOrderId, createMethodType, SELF_MADE, шаблон кода]
    where: >
      Документ «Заказ на эмиссию кодов маркировки» (товарная группа, шаблон кода, тип кода, способ выпуска,
      тип оплаты, количество); справочники «Материалы» (GTIN) и «Товарные группы»; константа «способ
      формирования серийного номера» в настройках обработчика.

  - name: Отчет о нанесении (СУЗ, utilisation)
    terms: [/api/v3/utilisation, отчет о нанесении, отчёт о нанесении, нанесение, sntins, utilisationType, productionDate, expirationDate, expDate72, срок годности 72 часа, срок годности до 72 часов]
    where: >
      Документ «Отчет о нанесении кодов маркировки» (реквизиты «Дата производства» и «Срок годности»);
      формируется по завершении задания на контрольной точке КТ1. Лимит отчета: 30 000 КМ (sntins).
      Изменения полей дат срока годности (expirationDate / expDate72) править здесь.

  - name: Ввод в оборот (True API, LP_INTRODUCE_GOODS)
    terms: [/lk/documents/create, LP_INTRODUCE_GOODS, ввод в оборот, document_format, product_document, uit_code, vsd_number, tnved_code, certificate_document_data, production_type, participant_inn, producer_inn, owner_inn, единый метод создания документов]
    where: >
      Документ «Ввод в оборот кодов маркировки» (ИНН участника, производителя и собственника, табличная часть:
      серийный номер, идентификатор ВСД, ТН ВЭД из справочника «Материалы»); константы обработчика: тип документа
      (LP_INTRODUCE_GOODS) и формат (MANUAL).

  - name: Информация о кодах маркировки (cises/info)
    terms: [cises/info, информация о коде, статус кода, код идентификации, КИ, проверка кода]
    where: >
      Верификация КМ на контрольной точке КТ1 (проверка статуса кода перед формированием отчета о нанесении).

  - name: Агрегация (короба, паллеты)
    terms: [/api/v3/aggregation, AGGREGATION_DOCUMENT, SSCC, агрегация, формирование упаковки, короб, паллета, транспортная упаковка]
    where: >
      В протоколе v1.2 не реализовано: для мясных изделий СУЗ API 3.0.37 агрегацию не поддерживает, она идет через
      True API (AGGREGATION_DOCUMENT). Если изменение делает агрегацию доступной или обязательной, это новый
      документ обмена, не правка существующих.

  - name: Вывод из оборота и брак (dropout, LK_RECEIPT)
    terms: [/api/v3/dropout, LK_RECEIPT, вывод из оборота, выбытие, отбраковка, списание брака, розничная продажа]
    where: >
      В протоколе v1.2 не реализовано: для мясных изделий выбытие и списание брака идут через True API (LK_RECEIPT),
      не через СУЗ. Если изменение затрагивает эти сценарии, это новый документ обмена.

  - name: Меркурий и ВСД
    terms: [Меркурий, ВетИС, ВСД, ветеринарный сопроводительный документ, vsd_number, гашение, погашение ВСД, Ветис.API, шлюз API]
    where: >
      Номер ВСД вносится вручную в реквизит документа «Ввод в оборот кодов маркировки» (автоматической связки
      с ФГИС «Меркурий» нет; при недоступности ВетИС допускается служебный нулевой идентификатор с корректировкой).

  - name: Шаблон кода и вес (GS1, переменный вес)
    terms: [GS1, не-GS1, шаблон 32, шаблон 74, AI 3103, вес, переменный вес, весовой товар, усушка, код проверки, криптохвост]
    where: >
      Реквизит «Шаблон кода» в документе заказа (32 не-GS1, 74 GS1) и разбор кода маркировки при верификации
      на КТ1 (учет идентификатора веса и шаблона).

  - name: Рыба и морепродукты (другие товарные группы)
    terms: [рыба, рыбная продукция, икра, пресервы, морепродукты, консервы, товарная группа, productGroup]
    where: >
      Справочники «Товарные группы» и «Материалы» (правила маркировки по номенклатуре). Документов обмена для рыбы
      в протоколе v1.2 нет: при подключении повторить сценарии заказ, нанесение, ввод в оборот под ее товарную группу.

  - name: Лимиты и форматы данных
    terms: [не более, максимум, лимит, длина поля, формат даты, yyyy-MM-dd, обязательное поле, обязательность, кодировка, размер запроса]
    where: >
      Реквизиты соответствующих документов обмена и ограничения в обработчике (размер пачки КМ, форматы дат,
      обязательные поля).

  - name: Сроки отключения и смена хостов API
    terms: [устаревшее API, отключение, версия API, новая версия, новый хост, адрес сервера, демо-контур, промышленный контур, HTTP 410]
    where: >
      Параметры подключения обработчика: адреса СУЗ и True API (демо и промышленный контур), версия API.
