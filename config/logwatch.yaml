# Счётчики ошибок в журнале вашей интеграции с Честным ЗНАКом. Рост строк «Устаревшее API» или «Токен не действителен»
# в боевом журнале — признак того, что API уже поменяли или вот-вот отключат старую версию.
#
# Как работает: при первом запуске журнал не читается, запоминается только его размер (старую историю не разбираем).
# Дальше каждый суточный запуск читает только дописанное с прошлого раза, считает строки по шаблонам и
# присылает «Сигнал» в письме, если число строк не меньше min_count и не меньше growth × обычного уровня
# (среднее за прошлые проверки; пока истории нет, обычный уровень считается нулевым).
# В письмо попадают только числа и имена файлов: строки журнала (в них бывают токены и персональные данные) нет.
#
# Что нужно от вас: в paths укажите пути к журналам интеграции (можно со звёздочкой: chz-*.log). Пока файлов
# по этим путям нет, проверка молча пропускается. Проверить: пункт 13 меню или «run.bat logwatch».
#
# Поля журнала: id, name, paths (список путей или масок), encoding (auto: UTF-8, иначе cp1251; можно указать
# конкретную, например utf-16), max_read_mb (сколько читать за раз, по умолчанию 200).
# Поля шаблона: id, name (в письме), pattern (регулярное выражение, регистр не важен), min_count (по умолчанию 1),
# growth (во сколько раз больше обычного уровня, по умолчанию 3).

logs:
  - id: integration
    name: "Журнал интеграции с Честным ЗНАКом"
    paths:
      - 'C:/TalarixMES/logs/chz*.log'   # <-- замените на реальный путь
    encoding: auto
    signatures:
      # В норме таких строк нет вовсе, поэтому любая уже сигнал.
      - id: deprecated-api
        name: "Устаревшее API"
        pattern: 'Устаревшее\s+API'
        min_count: 1

      # Срок действия токена истекает и в обычной работе, поэтому порог выше: сигнал при пяти и более строках
      # и при росте втрое против обычного уровня.
      - id: token-invalid
        name: "Токен не действителен"
        pattern: 'Токен\s+не\s+действителен'
        min_count: 5
        growth: 3
