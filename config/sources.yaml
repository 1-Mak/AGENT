  #   focus: >
  #     Изменения в методах API, форматах запросов и ответов, обязательных полях, кодах ошибок и сроках.

  # Собственная копия спецификации OpenAPI (из статьи на Infostart или выгрузка): обновили файл — пришла разница.
  # - id: true-api-spec
  #   name: "Спецификация TrueAPI (наша копия)"
