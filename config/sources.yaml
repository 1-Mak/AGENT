# Источники для мониторинга. Чтобы добавить новый сайт — добавьте запись, код менять не нужно.
#
# Типы источников (type):
#   list      — страница-список; на ней ищем ссылки по link_pattern, каждая новая ссылка = новый документ
#   sitemap   — то же, но ссылки берём из sitemap.xml (удобно, если список подгружается JS-ом)
#   page      — одна страница; отслеживаем изменения её текста
#   pdf       — один PDF-файл; отслеживаем изменения его текста (не байтов: пересборка файла ложных тревог не даёт)
#               Ссылки на PDF в списках (type: list) тоже работают: адрес на .pdf читается как PDF.
#   text      — текстовый файл: JSON/OpenAPI-спецификация, YAML, обычный текст. JSON приводится к каноническому
#               виду, поэтому разница показывает только смысловые правки. У OpenAPI заголовок = info.title + version.
#   telegram  — публичный Telegram-канал в веб-версии (https://t.me/s/имя_канала): каждое сообщение — документ
#
# Адрес вида file:///C:/specs/trueapi.json читается с диска: так можно следить за собственной копией спецификации
# (положили свежую версию в папку — в письме придёт разница с прошлой).
#
# Общие поля:
#   id               — уникальный идентификатор (латиница), по нему хранится состояние
#   name             — название для писем
#   url              — адрес страницы / списка / sitemap / файла
#   enabled          — false: источник не участвует в запуске, но его можно проверить пунктом 2 меню (по умолчанию true)
#   robots           — respect | warn | off: как относиться к robots.txt сайта для этого источника
#                      (по умолчанию как в .env, SITEWATCH_ROBOTS=respect: запрещённое не загружается)
#   focus            — что важно читателю; подсказка агенту-аналитику
#   content_selector — CSS-селектор основного текста (если не задан, берётся main/article/body)
#   ignore_regex     — список регулярных выражений: совпавшие строки текста игнорируются (счётчики, даты и т.п.)
#                      Для PDF номера страниц и колонтитулы убираются сами.
#   fetch            — http | browser: чем открывать страницу (по умолчанию http). browser — настоящий браузер
#                      (Playwright; на Windows берётся установленный Edge): для сайтов, где список рисуется скриптом
#                      или обычный запрос получает заглушку антибота. Нужен pip install playwright, см. README.
# Для list/sitemap/telegram:
#   link_pattern     — регулярное выражение для ссылок на документы (обязательно для list и sitemap)
#   recheck_latest   — сколько последних известных документов перепроверять на правки (по умолчанию 0)
#   initial_notify   — сколько самых свежих документов прислать при первом запуске (по умолчанию 1);
#                      остальные запоминаются молча, чтобы не засыпать почту архивом
#   max_new_per_run  — защита от лавины: максимум новых документов за запуск (по умолчанию 10)
#   strip_query      — true: у найденных ссылок отбрасывать ?параметры (одна и та же тема форума с разными
#                      ?attempt=1 и без них считается одним документом)

# Что нужно читателю. Агент выписывает из документов только это; документ, где ничего подходящего нет,
# в письмо не попадает (в конце письма перечислено, что отфильтровано, чтобы заметить ошибку фильтра).
scope:
  interests: >
    Мясо и мясная продукция в любом виде (охлажденное и замороженное мясо, птица, мясные полуфабрикаты,
    колбасы, субпродукты, мясные консервы) и рыба любая (охлажденная, мороженая, икра, пресервы, морепродукты,
    рыбные консервы): коды маркировки, заказ кодов, нанесение, ввод в оборот, агрегация, вывод из оборота,
    веса, сроки годности, ветеринарные сопроводительные документы и система «Меркурий» (ВетИС).
  # Брать ли общие изменения, которые касаются всех товарных групп (API, авторизация, форматы, отчёты, коды):
  # они затрагивают и вашу интеграцию. false — присылать только то, что прямо про мясо и рыбу.
  include_general: true
  # Таблица «метод API или термин -> где менять в вашей системе (ТАЛАРИКС MES)». Если файла нет,
  # уберите эту строку: письмо будет отвечать на «что изменилось», но не на «где править».
  glossary: config/glossary.yaml
  # Календарь сроков: даты, которые вы знаете сами (рассылки ЧЗ, письма клиентов). Даты из документов агент
  # добавляет сам; напоминания приходят за 30/14/7/3/1 день и в день срока. Показать: run.bat deadlines.
  milestones: config/milestones.yaml

sources:
  - id: chestny-znak-releases
    name: "Честный ЗНАК — «Что нового в системе»"
    type: list
    url: https://xn--80ajghhoc2aj1c8b.xn--p1ai/info/releasenotes/
    link_pattern: '/info/releasenotes/chto-novogo-[^/?#]+/?$'
    focus: >
      Изменения для участников оборота и интеграторов по мясу и рыбе, а также общие: требования и сроки,
      изменения в API и форматах обмена данными, исправленные ошибки, влияющие на интеграции.
    recheck_latest: 3
    initial_notify: 1

  # --- Ниже источники из подборки. Все выключены: адреса выведены из поиска и не проверены (с облачной среды сайты
  # --- недоступны). Проверьте каждый командой «run.bat check-sources --source ID» (или пунктом 2 меню: он показывает
  # --- и выключенные), убедитесь, что парсер видит ссылки и нормальный текст, и только потом уберите enabled: false.

  # Форум Infostart, лента темы «Маркировка» (все разделы форума). Здесь первыми появляются сообщения «у нас
  # сломалось»: за последние несколько месяцев поломка и обходной путь были на форуме за часы до рассылки ЧЗ.
  # Новые ответы в уже известных темах тоже важны (в них пишут обходные пути), поэтому свежие темы перепроверяются.
  # Перед включением: «run.bat check-sources --source infostart-marking». Если ссылок 0 или вместо страницы заглушка,
  # поставьте fetch: browser. Если в тексте тем есть счётчики просмотров, добавьте их в ignore_regex.
  - id: infostart-marking
    name: "Infostart — форум, тема «Маркировка»"
    type: list
    url: https://forum.infostart.ru/?tag=33815
    link_pattern: '/forum\d+/topic\d+/?$'
    strip_query: true
    recheck_latest: 10
    initial_notify: 0
    max_new_per_run: 10
    enabled: false
    focus: >
      Сообщения об изменениях и поломках API Честного знака (TRUE API, СУЗ, ГИС МТ), особенно по мясу и рыбе:
      новые тексты ошибок, коды ответов, отключенные или изменившиеся методы и поля, смена токенов и схем подписи,
      обходные пути и официальные ответы. Бытовые вопросы по настройке и вопросы без ответа по существу не важны.
      Для обходных путей важно, что именно изменили в запросе или настройках.

  # Документ ЦРПТ «Анонсирование планируемых изменений в СУЗ» (редакции выходят раз в 2-5 недель). Он лежит в личном
  # кабинете за входом, поэтому скачивайте PDF вручную и кладите в папку по этому пути, перезаписывая прошлую
  # редакцию: в письме придет разбор того, что поменялось между редакциями. Путь поправьте под свой компьютер.
  - id: suz-announcement
    name: "ЦРПТ — анонсирование планируемых изменений в СУЗ (локальный PDF)"
    type: pdf
    url: file:///C:/sitewatch/inbox/suz_announcement.pdf
    enabled: false
    initial_notify: 1
    focus: >
      Документ перечисляет планируемые изменения СУЗ API по методам и товарным группам с датами; в каждой редакции
      есть новые, перенесенные и исключенные строки. Нужны изменения по методам, которые использует интеграция
      (POST /api/v3/order, POST /api/v3/utilisation, aggregation, dropout), для товарных групп «Мясные изделия»,
      рыбы и морепродуктов, а также общие для всех групп: авторизация и токены, формат подписи, смена хостов,
      лимиты и обязательные поля. Раздел «Исключена информация» описывает изменения, уже внедренные в рабочей среде:
      отметь их как внедренные. Сроки приводи как в документе, даты с неточностью до месяца помечай как примерные.

  # Сообщество разработчиков: вопросы и ошибки API (разбор ошибок авторизации, токенов и т.п.).
  - id: markirovka-developers
    name: "markirovka.ru — сообщество разработчиков (API и ошибки)"
    type: list
    url: https://markirovka.ru/community/developers
    link_pattern: '/community/developers/[^/?#]+/?$'
    enabled: false
    max_new_per_run: 10
    focus: >
      Ошибки и изменения поведения API: новые тексты ошибок, коды ответов, отключённые методы, смена хостов
      и схем ответа. Вопросы без ответа по существу не важны.

  # Разделы markirovka.ru по группам «мясо» и «консервы»: впишите адреса разделов, раскомментируйте и проверьте.
  # - id: markirovka-myaso
  #   name: "markirovka.ru — мясная продукция"
  #   type: list
  #   url: <адрес раздела на markirovka.ru>
  #   link_pattern: '<шаблон ссылок на статьи этого раздела>'
  #   enabled: false

  - id: kontur-markirovka-news
    name: "Контур.Маркировка — новости"
    type: list
    url: https://kontur.ru/markirovka/news
    link_pattern: '/markirovka/news/\d+-[^/?#]+'
    enabled: false
    focus: Правила и сроки маркировки мяса, рыбы и консервов, изменения в работе с системой.

  - id: kontur-mercury-news
    name: "Контур.Меркурий — новости"
    type: list
    url: https://kontur.ru/mercury/news
    link_pattern: '/mercury/news/\d+-[^/?#]+'
    enabled: false
    focus: Изменения в ФГИС «Меркурий» и ВСД, API шлюза, требования к оформлению документов по мясу и рыбе.

  # Справка ВетИС (help.vetrf.ru) похожа на MediaWiki, поэтому следим за страницей «Последние изменения».
  # Адрес предположительный: если на сайте другая вики или нет такой страницы, проверка покажет это.
  - id: vetis-help-changes
    name: "Помощь Меркурия (ВетИС) — последние изменения справки"
    type: page
    url: https://help.vetrf.ru/index.php?title=Special:RecentChanges&days=14&limit=100&hidebots=1
    enabled: false
    focus: Изменения в справке по ВСД, Меркурию и API ВетИС.

  # Канал уведомлений по МДЛП (лекарства). Для мяса и рыбы там нужно разве что общее: технические работы, API.
  # Фильтр по теме отсеет остальное. Нужен адрес именно вида t.me/s/...
  - id: mdlp-telegram
    name: "Telegram: oms_mdlp_notif (уведомления МДЛП)"
    type: telegram
    url: https://t.me/s/oms_mdlp_notif
    enabled: false
    recheck_latest: 3
    initial_notify: 1

