# Сроки, которые вы знаете сами: из рассылки ЧЗ, письма клиента, документа «Анонсирование планируемых изменений в СУЗ».
# Агент находит даты в документах сам (команда «sitewatch deadlines» показывает все), а сюда вносят то,
# чего на сайтах нет или что пришло закрытым каналом.
#
# Поля:
#   date        — ДД.ММ.ГГГГ (обязательно)
#   title       — что наступает и что из-за этого делать (обязательно)
#   components  — названия записей из config/glossary.yaml, которых касается срок (чтобы письмо показало, где менять)
#   approx      — true, если в источнике назван только месяц: тогда ставьте последний день месяца
#   origin      — откуда срок (по умолчанию «вручную»)
#   url, note   — ссылка и пометки
#
# Напоминания придут за 30, 14, 7, 3 и 1 день и в день срока. Правите запись: старая убирается, новая добавляется.
# Снять срок с напоминаний, не правя файл: sitewatch deadlines --done КЛЮЧ
milestones:
  - date: 01.10.2026
    title: >
      Для ТГ «Мясные изделия» в отчете о нанесении появляется поле expDate72 (срок годности до 72 часов).
      Проверить, не заменяет ли оно expirationDate, и обновить формирование отчета.
    components: [Отчет о нанесении (СУЗ, utilisation)]
    origin: "Анонсирование планируемых изменений в СУЗ, ред. 1.31"
    note: Связь expDate72 и expirationDate (редакция руководства СУЗ от 22.06.2026) не подтверждена, уточнить у ЦРПТ.
