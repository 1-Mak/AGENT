# Контрольные вызовы API: раз в сутки (вместе с основным запуском) программа дёргает несколько методов вашей
# интеграции и сравнивает ответ с прошлым разом. В письмо попадает раздел «Сигналы API», если:
#   - метод отвечает HTTP 410 (отключён);
#   - запрос стал перенаправляться на другой хост (сменился адрес сервера);
#   - изменился статус ответа (например, 401 -> 404);
#   - при том же статусе (401, 404 ...) изменился текст ошибки («Токен не действителен» -> «Устаревшее API»);
#   - при том же статусе изменился состав полей JSON-ответа;
#   - метод не отвечает 2 запуска подряд (unreachable_after).
# Первый запуск ничего не сообщает (кроме HTTP 410): он запоминает ответы «как сейчас».
#
# Что нужно от вас:
#   1. В .env задать TRUE_API_BASE (адрес API, лучше тестовый контур) и, если есть, TRUE_API_TOKEN.
#      Пока переменная из url не задана, проба пропускается без сигналов.
#   2. Без токена методы с авторизацией тоже полезны: видны статус и текст ошибки (обычно 401), и сигнал
#      сработает, если они изменятся. С токеном проверяется и содержимое ответа. Токен в письма и журнал не попадает.
#   3. Токен можно получать автоматически: укажите ниже token.command (программа, которая печатает токен
#      в последней строке вывода), например команду из вашей интеграции с подписью УКЭП.
#   4. Проверить, что получается, без отправки писем и сохранения: пункт 12 меню или «run.bat probes».
#      Запомнить сегодняшние ответы как исходные: «run.bat probes --save» (иначе это сделает первый боевой запуск).
#
# Пробы ничего не меняют в системе, но это настоящие запросы: используйте тестовые данные и тестовый контур.
# Адреса и тела запросов ниже — ПРИМЕРЫ в духе TrueAPI: сверьте их со своей интеграцией и подставьте свои методы
# (авторизация, cises/info, документы, отчёт о нанесении — 5-10 методов, которыми вы реально пользуетесь).
#
# Поля пробы: id (латиница), name (в письме), method (GET по умолчанию), url, headers, json (тело запроса),
# body (тело строкой), timeout (секунды, по умолчанию 20). В url, headers, json и body работает ${ИМЯ}:
# значение берётся из .env (${ИМЯ:-запасное значение} — с запасным). Заголовок, в котором переменная не задана (например, нет токена), просто не отправляется.

# token:
#   env: TRUE_API_TOKEN                 # из какой переменной брать токен (по умолчанию так)
#   command: C:\tools\get_token.bat     # необязательно: команда печатает токен; запускается раз в сутки, если токена в .env нет
unreachable_after: 2

probes:
  # Получение ключа для подписи: токен не нужен. Если метод отключат или переедет адрес, это будет видно сразу.
  - id: auth-key
    name: "Авторизация: получение ключа (auth/key)"
    method: GET
    url: ${TRUE_API_BASE}/auth/key

  # Информация о кодах маркировки. Лучше взять настоящий тестовый код из своего контура (TRUE_API_TEST_KM в .env):
  # так в ответе будут все поля. Без него уходит заведомо вымышленный код, и проба видит хотя бы статус и ошибку.
  - id: cises-info
    name: "Информация о кодах (cises/info)"
    method: POST
    url: ${TRUE_API_BASE}/cises/info
    headers:
      Authorization: Bearer ${TRUE_API_TOKEN}
      Content-Type: application/json
    json: ["${TRUE_API_TEST_KM:-0104600000000000215TESTCODE0000000}"]

  # --- Подставьте свои методы по образцу: документы и отчёт о нанесении ---

  # - id: documents-list
  #   name: "Документы: список"
  #   method: GET
  #   url: ${TRUE_API_BASE}/<адрес метода списка документов из вашей интеграции>
  #   headers:
  #     Authorization: Bearer ${TRUE_API_TOKEN}

  # - id: application-report
  #   name: "Отчёт о нанесении"
  #   method: GET
  #   url: ${TRUE_API_BASE}/<адрес метода, которым вы получаете или проверяете отчёт о нанесении>
  #   headers:
  #     Authorization: Bearer ${TRUE_API_TOKEN}
