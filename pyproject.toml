[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitewatch"
version = "0.1.0"
description = "Мониторинг обновлений документации на сайтах: парсинг, анализ агентом (Claude) и отправка дайджеста на почту"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "anthropic>=1.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sitewatch = "sitewatch.cli:main"

[tool.setuptools]
packages = ["sitewatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
